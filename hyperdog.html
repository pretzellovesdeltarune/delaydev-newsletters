<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperdog!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .oc-container {
            position: absolute;
            z-index: 1;
            text-align: center;
        }

        .oc-sprite {
            width: 150px;
            height: auto;
        }

        .track {
            position: absolute;
            bottom: 20%;
            width: 100%;
            height: 120px;
        }

        .running-dog {
            width: 120px;
            height: auto;
            position: absolute;
            animation: patrol 6s linear infinite; 
        }

        @keyframes patrol {
            0% {
                left: -150px;
                transform: scaleX(1);
            }
            45% {
                transform: scaleX(1);
            }
            50% {
                left: calc(100% + 50px);
                transform: scaleX(-1);
            }
            95% {
                transform: scaleX(-1);
            }
            100% {
                left: -150px;
                transform: scaleX(1);
            }
        }

        .audio-wrapper {
            position: absolute;
            top: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="audio-wrapper">
        <audio controls autoplay loop>
            <source src="assets/Hyperdog.ogg" type="audio/ogg">
        </audio>
    </div>

    <div class="oc-container">
        <img class="oc-sprite" src="assets/oc.png" alt="Confused OC">
    </div>

    <div class="track">
        <img class="running-dog" src="assets/dog.gif" alt="Running Dog">
    </div>

</body>
</html>
