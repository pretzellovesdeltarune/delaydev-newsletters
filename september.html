<!DOCTYPE html>
<html>
<head>
    <title>September Newsletter</title>
    <style>
        @font-face {
            font-family: 'mainfont';
            src: url('assets/8bitOperatorPlus-Regular.ttf');
        }

        body {
            background-color: black;
            color: #ff9900;
            font-family: 'mainfont', sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
    
        .container {
            max-width: 600px;
            width: 100%;
            text-align: left;
            padding-left: 2px;
            box-sizing: border-box;
            position: relative;
        }
    
        .logo {
            width: 596px;
            height: 200px;
            display: block;
            margin: 0 auto 20px auto;
        }
    
        .slide {
            width: 800px;
            height: 272px;
            display: block;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            margin: 20px 0;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
        }

        .image {
            display: block;
            width: auto;
            height: auto;
            margin: 20px auto;
            max-width: 100%;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #888888;
        }
        
        .footer-links {
            margin-top: 8px;
            font-size: 14px;
        }
        
        .footer-links a {
            color: #888888;
            text-decoration: underline;
        }
        
        .footer-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/september newsletter logo.png?v=2" alt="Newsletter Logo" class="logo">
        <img src="assets/pretzelseptember_slide1.png" alt="Pretzel Slide 0" class="slide">
        <div style="color: #ffffff; font-family: 'mainfont'; background-color: #000000; padding: 0px;">
                <p>It's Autumn.</p>
                <p>And it's gonna get spooky soon.</p>
        </div>

        <div class="footer">
            <p style="margin: 0;">pretzel_xdxd</p>
            <div class="footer-links">
                <a href="https://discord.gg/AXCnQatFcn" target="_blank" rel="noopener noreferrer">Discord</a> | 
                <a href="https://www.youtube.com/@pretzeldeltarune" target="_blank" rel="noopener noreferrer">YouTube</a>
            </div>
        </div>
    </div>

</body>
</html>
